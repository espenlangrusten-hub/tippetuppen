name: Importer draktnumre

# Fills in starting-eleven shirt numbers from UEFA's match data, checked against
# Wikipedia's tournament pages and fotball.no, and borrows across neighbouring matches
# from September 2006 (src/data/shirts.ts has the rules). Commits the result to the
# branch it ran on, with the report in the job summary.
#
# A push that touches the importer starts it: the assistant working on this repository
# can push but cannot dispatch a workflow. A push made by this job does not start it
# again - GitHub never triggers workflows from the job's own token.

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import/shirt-numbers.ts
      - scripts/import/shirt-format.ts
      - src/data/shirts.ts
      - .github/workflows/import-shirts.yml

permissions:
  contents: write

concurrency:
  group: import-shirts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Start from main's match files, never from an earlier run's output: a run that
      # removed one side of a conflict would otherwise let the next run forget it.
      - name: Start fra kampdataene på main
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- data/source/matches

      - name: Hent numre
        run: node --import tsx scripts/import/shirt-numbers.ts

      # A number written into a match file is served to players; nothing that fails
      # validation gets that far.
      - name: Valider dataene
        run: npm run data:validate

      - name: Commit endringene
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- data/source/matches; then
            echo "Ingen endringer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/matches
          git commit -q -F - <<EOF
          Draktnumre fra UEFA, kontrollert mot Wikipedia og fotball.no

          $(sed -n '3,6p' shirt-report.md)

          Konflikter og mulige oppstillingsfeil står i jobbsammendraget for kjøring
          ${{ github.run_id }}.
          EOF
          git push origin HEAD:${{ github.ref_name }}
