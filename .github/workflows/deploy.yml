name: Deploy

# Publishes the static site to GitHub Pages and the game API to Supabase.
# Requires (Settings → Secrets and variables → Actions):
#   secrets.SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   secrets.SUPABASE_PROJECT_REF    the project ref, e.g. abcdefghijklmnop
#   vars.NEXT_PUBLIC_SITE_URL       public URL of the finished site
#   vars.NEXT_PUBLIC_BASE_PATH      "/<repo>" on a github.io URL, empty on a custom domain
#   vars.NEXT_PUBLIC_API_URL        https://<ref>.supabase.co/functions/v1/api
#   vars.NEXT_PUBLIC_SUPABASE_ANON_KEY
#   vars.NEXT_PUBLIC_ADSENSE_* and vars.NEXT_PUBLIC_CMP  (optional)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preflight:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Required secrets and variables are present
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || missing="$missing\n  secret  SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)"
          [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ]  || missing="$missing\n  secret  SUPABASE_PROJECT_REF   (the ref in your Supabase project URL)"
          [ -n "${{ vars.NEXT_PUBLIC_API_URL }}" ]      || missing="$missing\n  var     NEXT_PUBLIC_API_URL    (https://<ref>.supabase.co/functions/v1/api)"
          [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]     || missing="$missing\n  var     NEXT_PUBLIC_SITE_URL   (public URL of the site)"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured yet. Add these under Settings → Secrets and variables → Actions:"
            printf "%b\n" "$missing"
            echo "See docs/RUNBOOK.md for the full list."
            exit 1
          fi
          echo "Configuration looks complete."

  function:
    name: Deploy Edge Function
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

  site:
    name: Build and publish site
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_HOME: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HOME }}
          NEXT_PUBLIC_ADSENSE_SLOT_RESULT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RESULT }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARCHIVE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARCHIVE }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          NEXT_PUBLIC_CMP: ${{ vars.NEXT_PUBLIC_CMP }}
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
