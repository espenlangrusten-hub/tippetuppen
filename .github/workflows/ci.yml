name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Edge Function typecheck
        run: npm run check:deno
      - name: Check login and ranked game transactions
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5544/postgres
        run: |
          set -euo pipefail
          npm run db:migrate
          npm run db:seed
          node --import tsx scripts/schedule.ts --days 10
          SUPABASE_DB_URL=postgres://postgres@127.0.0.1:5544/postgres ./node_modules/.bin/deno run --node-modules-dir=manual --allow-net --allow-env --allow-read --config supabase/functions/deno.json supabase/functions/api/index.ts &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --max-time 5 -sf -o /dev/null 'http://127.0.0.1:8000/api/today?game=mangler-xi'; then break; fi
            sleep 1
          done
          node scripts/verify-game-api.mjs
      - name: Build static site
        run: npm run build
