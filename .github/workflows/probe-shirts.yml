name: Prøvehenting av draktnumre

# Looks at what UEFA, Wikipedia and fotball.no actually return before an importer for
# shirt numbers is written. Prints to the log; commits nothing. The build sandbox reaches
# none of these hosts, which is why this runs on a runner.
#
# A push that touches the probe itself starts it: the assistant working on this
# repository can push but cannot dispatch a workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import/shirt-probe.ts
      - .github/workflows/probe-shirts.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/import/shirt-probe.ts
